// ── Hooks ─────────────────────────────────────────────────────────────────
function useInterval(fn, ms) {
  const saved = useRef(fn);
  useEffect(() => { saved.current = fn; });
  useEffect(() => {
    if (ms == null) return;
    const id = setInterval(() => saved.current(), ms);
    return () => clearInterval(id);
  }, [ms]);
}

function usePulse(ms = 600) {
  const [on, set] = useState(false);
  useInterval(() => set(p => !p), ms);
  return on;
}

function useTypewriter(text, cps, speedMul) {
  const [idx, setIdx] = useState(0);
  const delay = Math.max(16, Math.round(1000 / (cps * speedMul)));
  useEffect(() => { setIdx(0); }, [text]);
  useEffect(() => {
    if (idx >= text.length) return;
    const t = setTimeout(() => setIdx(i => Math.min(i + 1, text.length)), delay);
    return () => clearTimeout(t);
  }, [idx, text.length, delay]);
  return text.slice(0, idx);
}

function useEasedNumber(target, durationMs) {
  const [val, setVal] = useState(0);
  const fromRef = useRef(0);
  useEffect(() => {
    const from = fromRef.current;
    const start = Date.now();
    let raf;
    const tick = () => {
      const t = Math.min(1, (Date.now() - start) / durationMs);
      const e = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      setVal(Math.round(from + (target - from) * e));
      if (t < 1) raf = requestAnimationFrame(tick);
      else fromRef.current = target;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, durationMs]);
  return val;
}

// Global runner handle — acts register themselves so keyboard shortcuts work
const gRunner = { step: () => {}, ff: () => {} };

function useActRunner(beats, { speedMul = 1, started = true, onComplete } = {}) {
  const ref = useRef({ beats, speedMul, onComplete, idx: -1, timer: null, started });
  useEffect(() => { ref.current.beats = beats; }, [beats]);
  useEffect(() => { ref.current.speedMul = speedMul; }, [speedMul]);
  useEffect(() => { ref.current.onComplete = onComplete; }, [onComplete]);

  const advance = useCallback((idx) => {
    const s = ref.current;
    if (idx >= s.beats.length) {
      ref.current.idx = s.beats.length;
      s.onComplete?.();
      return;
    }
    s.beats[idx]?.apply?.();
    ref.current.idx = idx;
    const delay = Math.max(16, Math.round((s.beats[idx]?.durationMs ?? 200) / s.speedMul));
    clearTimeout(s.timer);
    s.timer = setTimeout(() => advance(idx + 1), delay);
  }, []);

  useEffect(() => {
    if (!started || beats.length === 0) return;
    advance(0);
    return () => clearTimeout(ref.current.timer);
  }, [started, advance]);

  const step = useCallback(() => {
    clearTimeout(ref.current.timer);
    advance(ref.current.idx + 1);
  }, [advance]);

  const ff = useCallback(() => {
    clearTimeout(ref.current.timer);
    const s = ref.current;
    for (let i = s.idx + 1; i < s.beats.length; i++) s.beats[i]?.apply?.();
    ref.current.idx = s.beats.length;
    s.onComplete?.();
  }, []);

  useEffect(() => {
    if (started) { gRunner.step = step; gRunner.ff = ff; }
  }, [started, step, ff]);

  return { step, ff };
}

const SPIN_FRAMES = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
function Spinner({ color }) {
  const [i, setI] = useState(0);
  useInterval(() => setI(n => (n+1) % SPIN_FRAMES.length), 80);
  return <span style={{ color }}>{SPIN_FRAMES[i]}</span>;
}

function TW({ text, cps=26, speedMul=1, color, bold, grad }) {
  const shown = useTypewriter(text, cps, speedMul);
  if (grad) return <span className="grad" style={{ fontWeight: bold?700:400 }}>{shown}</span>;
  return <span style={{ color: color||c.body, fontWeight: bold?700:400 }}>{shown}</span>;
}

function Grad({ children, bold }) {
  return <span className="grad" style={{ fontWeight: bold?700:400 }}>{children}</span>;
}

function Tracked({ children, color }) {
  return <span style={{ color: color||c.label }}><span style={{ color:c.dim }}>⬡ </span>{children}</span>;
}

function Tick() { return <span style={{ color:c.done }}>✓</span>; }
function Dot()  { return <span style={{ color:c.dim }}>◌</span>; }
function Stars({ n }) {
  return <span style={{ color:c.label }}>{'★'.repeat(n)}{'☆'.repeat(Math.max(0,5-n))}</span>;

// ── Logo (Act 1 phase 1) ──────────────────────────────────────────────────
const LOGO = [
  "      _                  _  _____  ",
  "     (_)_   _ _ __  __ _| ||___ /  ",
  "  _   | | | | | '_ \\/ _` | |  |_ \\ ",
  " | |_| | |_| | | | | (_| | | ___) |",
  "  \\___/ \\__,_|_| |_|\\__, |_||____/ ",
  "                      |___/         ",
];

function Logo({ speedMul, onDone }) {
  const [shown, setShown] = useState(0);
  useEffect(() => {
    if (shown >= LOGO.length) {
      const t = setTimeout(() => onDone?.(), Math.round(500 / speedMul));
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setShown(n => n+1), Math.round(110 / speedMul));
    return () => clearTimeout(t);
  }, [shown, speedMul, onDone]);
  return (
    <div style={{ textAlign:'center', padding:'12px 0' }}>
      <pre style={{ display:'inline-block', textAlign:'left', lineHeight:1.55 }}>
        {LOGO.slice(0, shown).map((line, i) =>
          <Grad key={i} bold>{line}{'\n'}</Grad>
        )}
      </pre>
      {shown < LOGO.length && <div style={{ color:c.dim, marginTop:4 }}><span className="blink">█</span></div>}
    </div>
  );
}

// ── Act 1 ─────────────────────────────────────────────────────────────────
const INIT_TASKS = [
  'Vending Jungle','Provisioning Substrate','Seeding Understory',
  'Wiring integrations','Opening operator console',
].map(label => ({ label, state:'pending' }));

function Act1({ speedMul, onComplete, teamName, onLog }) {
  const [phase, setPhase] = useState('logo');
  const [tasks, setTasks] = useState(INIT_TASKS.map(t => ({...t})));
  const [payoff, setPayoff] = useState(false);
  const cur = useRef(0);

  const emit = useCallback(() => {
    const e = act1Events[cur.current]; if (!e) return;
    cur.current++;
    onLog(e[0].replaceAll('{team}', teamName), e[1]);
  }, [teamName, onLog]);

  const setT = (i, state) => setTasks(p => p.map((t,j) => j===i ? {...t,state} : t));

  const beats = useMemo(() => [
    {durationMs:200, apply:()=>setT(0,'active')},
    {durationMs:220, apply:()=>emit()},
    {durationMs:220, apply:()=>emit()},
    {durationMs:260, apply:()=>setT(0,'done')},
    {durationMs:180, apply:()=>setT(1,'active')},
    {durationMs:200, apply:()=>emit()},
    {durationMs:220, apply:()=>emit()},
    {durationMs:260, apply:()=>setT(1,'done')},
    {durationMs:180, apply:()=>setT(2,'active')},
    {durationMs:220, apply:()=>emit()},
    {durationMs:220, apply:()=>emit()},
    {durationMs:220, apply:()=>emit()},
    {durationMs:240, apply:()=>emit()},
    {durationMs:260, apply:()=>setT(2,'done')},
    {durationMs:180, apply:()=>setT(3,'active')},
    {durationMs:260, apply:()=>emit()}, // warn
    {durationMs:540, apply:()=>{}},
    {durationMs:200, apply:()=>emit()},
    {durationMs:200, apply:()=>emit()},
    {durationMs:220, apply:()=>emit()},
    {durationMs:260, apply:()=>setT(3,'done')},
    {durationMs:180, apply:()=>setT(4,'active')},
    {durationMs:200, apply:()=>emit()},
    {durationMs:200, apply:()=>emit()},
    {durationMs:220, apply:()=>emit()},
    {durationMs:240, apply:()=>emit()},
    {durationMs:260, apply:()=>setT(4,'done')},
    {durationMs:600, apply:()=>{}},
    {durationMs:200, apply:()=>setPayoff(true)},
    {durationMs:260, apply:()=>emit()},
    {durationMs:1300,apply:()=>{}},
    {durationMs:150, apply:()=>{}},
  ], [emit]);

  useActRunner(beats, { speedMul, started: phase === 'scene', onComplete: phase === 'scene' ? onComplete : undefined });

  if (phase === 'logo') return <Logo speedMul={speedMul} onDone={() => setPhase('scene')} />;

  return (
    <div style={{ display:'flex', gap:16 }}>
      <div style={{ width:130, flexShrink:0 }}><Act1Glyph /></div>
      <div style={{ flex:1 }}>
        <div style={{ marginBottom:6 }}>
          <Tracked>{`vending jungle · team ${teamName}`}</Tracked>
        </div>
        {tasks.map((t,i) => (
          <div key={i} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:2 }}>
            <span style={{ width:16 }}>
              {t.state==='pending' && <Dot />}
              {t.state==='active'  && <Spinner color={c.live} />}
              {t.state==='done'    && <Tick />}
            </span>
            <span style={{ color: t.state==='pending' ? c.dim : t.state==='done' ? c.done : c.body }}>
              {t.label}
            </span>
          </div>
        ))}
        <div style={{ marginTop:10 }}>
          {payoff
            ? <TW text={`Jungle ${teamName} is alive.`} cps={26} speedMul={speedMul} grad bold />
            : <span style={{color:c.dim}}> </span>}
        </div>
      </div>
    </div>
  );
}

function PersonaLine({ persona, row, ember, speedMul }) {
  const ms = Math.max(60, Math.round(600 * speedMul));
  const sess = useEasedNumber(row.sessionsTarget, ms);
  const defs = useEasedNumber(row.defectsTarget, ms);
  const defCol = ember ? c.rare : defs > 0 ? c.label : c.dim;
  const stateCols = { idle:c.dim, probing:c.live, reporting:c.label, done:c.done };
  return (
    <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:3 }}>
      <span style={{ width:16 }}>
        {row.state==='idle'      && <Dot />}
        {row.state==='probing'   && <Spinner color={c.live} />}
        {row.state==='reporting' && <span style={{color:c.label}}>›</span>}
        {row.state==='done'      && <Tick />}
      </span>
      <span style={{ width:100, color: row.state==='idle' ? c.dim : c.body }}>{persona.role}</span>
      <span style={{ width:80,  color: stateCols[row.state] }}>{row.state}</span>
      <span style={{ width:62,  color: c.muted }}>{String(sess).padStart(2,' ')} sess</span>
      <span style={{ color:defCol, fontWeight:ember?700:400, width:82 }}>{String(defs).padStart(2,' ')} defect{defs===1?'':'s'}</span>
      <span style={{ fontSize:11, color: row.state==='done' ? c.done : c.dim }}>
        {row.state==='done' ? `■ 0 critical · ${persona.defects} minor` : ''}
      </span>
    </div>
  );
}

function DefectTrace({ persona, visible }) {
  if (!visible) return null;
  return (
    <div style={{ marginLeft:16, fontSize:11, color:c.muted, lineHeight:1.55 }}>
      <span style={{color:c.dim}}>↳ </span>
      <span style={{color:c.rare}}>!</span>
      <span style={{color:c.dim}}> trace</span>
      <span style={{color:c.dim}}>: </span>
      <span style={{color:c.body}}>{persona.trace}</span>
    </div>
  );
}

function Act3({ speedMul, onComplete, onLog }) {
  const [rows, setRows] = useState(personas.map(() => ({ state:'idle', sessionsTarget:0, defectsTarget:0 })));
  const [active, setActive] = useState(-1);
  const [ember, setEmber] = useState(-1);
  const [payoff, setPayoff] = useState(false);
  const cur = useRef(0);
  const emit = useCallback(() => {
    const e = act3Events[cur.current]; if (!e) return;
    cur.current++;
    onLog(e[0], e[1]);
  }, [onLog]);
  const setRow = (i, patch) => setRows(p => p.map((r,j) => j===i ? {...r,...patch} : r));

  const beats = useMemo(() => {
    const out = [];
    out.push({durationMs:300,apply:()=>emit()});
    out.push({durationMs:360,apply:()=>emit()});
    out.push({durationMs:400,apply:()=>{}});
    personas.forEach((p, i) => {
      out.push({durationMs:280,apply:()=>{ setActive(i); setRow(i,{state:'probing',sessionsTarget:p.sessions}); }});
      out.push({durationMs:340,apply:()=>emit()});
      out.push({durationMs:600,apply:()=>{}});
      out.push({durationMs:280,apply:()=>{ setRow(i,{state:'reporting',defectsTarget:p.defects}); if(i===0) setEmber(0); }});
      out.push({durationMs:340,apply:()=>emit()});
      out.push({durationMs:280,apply:()=>{ if(i===0) setEmber(-1); }});
      out.push({durationMs:320,apply:()=>setRow(i,{state:'done'})});
      out.push({durationMs:280,apply:()=>{}});
    });
    out.push({durationMs:360,apply:()=>{ setActive(-1); emit(); }});
    out.push({durationMs:500,apply:()=>{}});
    out.push({durationMs:240,apply:()=>setPayoff(true)});
    out.push({durationMs:320,apply:()=>emit()});
    out.push({durationMs:1300,apply:()=>{}});
    out.push({durationMs:150,apply:()=>{}});
    return out;
  }, [emit]);

  useActRunner(beats, { speedMul, onComplete });

  return (
    <div style={{ display:'flex', gap:16 }}>
      <div style={{ width:120, flexShrink:0, paddingTop:4 }}><Act3Glyph active={active} /></div>

  );
}

// ── Operator Console ────────────────────────────────────────────────────
const OP_HELP = [
  ['jungle list',                   'show all active jungles'],
  ['jungle status <name>',          'health + act progress'],
  ['jungle logs <name> --tail',     'stream recent events'],
  ['jungle teardown <name>',        'deallocate a jungle'],
  ['gallery list',                  'browse Canopy gallery'],
  ['help',                          'show this help'],
  ['clear',                         'clear the screen'],
];

function OperatorConsole({ teamName }) {
  const [banner, setBanner] = useState(0);
  const [history, setHistory] = useState([]);
  const [input, setInput] = useState('');
  const [cmdHistory, setCmdHistory] = useState([]);
  const [histIdx, setHistIdx] = useState(-1);
  const inputRef = useRef(null);
  const scrollRef = useRef(null);

  useEffect(() => { inputRef.current?.focus(); }, []);
  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [history.length, banner]);

  // Animated welcome banner
  useEffect(() => {
    if (banner >= 6) return;
    const t = setTimeout(() => setBanner(b => b+1), 180);
    return () => clearTimeout(t);
  }, [banner]);

  const push = (items) => setHistory(h => [...h, ...items]);

  // Highlight jungl3 syntax in a command string
  const renderCmd = (cmd) => {
    const parts = cmd.split(/\s+/);
    return parts.map((p, i) => {
      const col = i === 0 ? c.grad1 : p.startsWith('--') ? c.label : p.startsWith('<') ? c.dim : c.body;
      return <span key={i}><span style={{color:col}}>{p}</span>{i < parts.length-1 ? ' ' : ''}</span>;
    });
  };

  const run = (cmd) => {
    const trimmed = cmd.trim();
    if (!trimmed) return;
    setCmdHistory(ch => [...ch, trimmed]);
    setHistIdx(-1);
    push([{ kind:'prompt', text:trimmed }]);
    const [head, ...rest] = trimmed.split(/\s+/);
    if (head === 'help') {
      push([{ kind:'title', text:'commands' }, ...OP_HELP.map(([cmd, d]) => ({ kind:'help', cmd, desc:d }))]);
    } else if (head === 'clear') {
      setHistory([]);
    } else if (head === 'jungle' && rest[0] === 'list') {
      push([
        { kind:'thead', cols:['NAME','ACT','STATUS','AGE','HEALTH'] },
        { kind:'trow',  cols:[`jungle-${teamName}`, '5', 'settled', '1h 02m', '●'], mine:true },
        { kind:'trow',  cols:['jungle-nova',  '1', 'vending',  '4m',    '●'] },
        { kind:'trow',  cols:['jungle-delta', '3', 'probing',  '28m',   '●'] },
        { kind:'trow',  cols:['jungle-ember', '2', 'shaping',  '12m',   '●'] },
      ]);
    } else if (head === 'jungle' && rest[0] === 'status') {
      const name = rest[1] || teamName;
      push([
        { kind:'title', text:`jungle-${name}` },
        { kind:'kv', k:'state',    v:'settled',                  tag:'ok' },
        { kind:'kv', k:'region',   v:'us-east-1' },
        { kind:'kv', k:'tests',    v:'47 passing · 0 failed',    tag:'ok' },
        { kind:'kv', k:'personas', v:'4 seeded · 6 defects (0 critical)' },
        { kind:'kv', k:'visitors', v:'3 · avg 4.0★' },
        { kind:'kv', k:'uptime',   v:'1h 02m' },
      ]);
    } else if (head === 'jungle' && rest[0] === 'logs') {
      push([
        { kind:'logline', ts:'22:14:03', src:'canopy',     text:'judge-a session expired' },
        { kind:'logline', ts:'22:14:11', src:'understory', text:'postgres backup rotated' },
        { kind:'logline', ts:'22:14:29', src:'heartbeat',  text:'all services green' },
        { kind:'logline', ts:'22:14:44', src:'synthetic',  text:'drift check · no anomalies' },
      ]);
    } else if (head === 'jungle' && rest[0] === 'teardown') {
      const name = rest[1] || teamName;
      push([
        { kind:'warn', text:`teardown jungle-${name}? [y/N] y` },
        { kind:'out',  text:`  ⤷ resources released · state archived · ${Math.floor(Math.random()*8)+2}s`, dim:true },
      ]);
    } else if (head === 'gallery' && rest[0] === 'list') {
      push([
        { kind:'title', text:'canopy · gallery' },
        { kind:'star', stars:5, who:'beta-user-b',   what:'claims-intake · "feels shipped"' },
        { kind:'star', stars:4, who:'judge-a',       what:'claims-intake · missed one label' },
        { kind:'star', stars:3, who:'stakeholder-c', what:'needs more reporting' },
      ]);
    } else {
      push([{ kind:'err', text:`unknown command: ${head}. try 'help'.` }]);
    }
  };

  const handleKey = (e) => {
    if (e.key === 'Enter') { run(input); setInput(''); return; }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (cmdHistory.length === 0) return;
      const i = histIdx < 0 ? cmdHistory.length - 1 : Math.max(0, histIdx - 1);
      setHistIdx(i); setInput(cmdHistory[i] || '');
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (histIdx < 0) return;
      const i = histIdx + 1;
      if (i >= cmdHistory.length) { setHistIdx(-1); setInput(''); }
      else { setHistIdx(i); setInput(cmdHistory[i]); }
    }
  };

  const bannerLines = [
    { text:'╭──────────────────────────────────────────────────────────╮', col:c.moss },
    { text:'│  jungl3 operator console                         v0.1.0  │', col:c.moss, accents:[[3, 'jungl3 operator console', c.grad1, 700], [50, 'v0.1.0', c.dim]] },
    { text:'│  connected · control-plane us-east-1 · account …012      │', col:c.moss, accents:[[3, 'connected', c.done]] },
    { text:`│  active jungle  ▸  jungle-${teamName.padEnd(30)} │`, col:c.moss, accents:[[3,'active jungle',c.dim],[19,'▸',c.label],[23,`jungle-${teamName}`,c.body,700]] },
    { text:'├──────────────────────────────────────────────────────────┤', col:c.moss },
    { text:"│  type 'help' for commands · 'clear' to wipe · ↑/↓ history │", col:c.muted },
    { text:'╰──────────────────────────────────────────────────────────╯', col:c.moss },
  ];

  const quickRefs = [
    ['jungle list',            'list all'],
    ['jungle status <name>',   'inspect'],
    ['jungle logs <name>',     'tail events'],
    ['gallery list',           'canopy ratings'],
    ['help',                   'all commands'],
  ];

  const renderRow = (h, i) => {
    if (h.kind === 'prompt') return (
      <div key={i} style={{ marginTop:4, display:'flex', gap:6 }}>
        <span style={{color:c.done, fontWeight:700}}>jungl3›</span>
        <span>{renderCmd(h.text)}</span>
      </div>
    );
    if (h.kind === 'title') return (
      <div key={i} style={{ marginTop:2, color:c.label, textTransform:'uppercase', letterSpacing:1, fontSize:10 }}>{h.text}</div>
    );
    if (h.kind === 'help') return (
      <div key={i} style={{ display:'flex', gap:10, paddingLeft:8 }}>
        <span style={{ color:c.grad1, width:200, fontWeight:600 }}>{h.cmd}</span>
        <span style={{ color:c.muted }}>{h.desc}</span>
      </div>
    );
    if (h.kind === 'thead') return (
      <div key={i} style={{ display:'flex', color:c.dim, textTransform:'uppercase', fontSize:10, letterSpacing:1, borderBottom:`1px solid ${c.dim}33`, paddingBottom:2, marginTop:2 }}>
        {h.cols.map((col, j) => (
          <span key={j} style={{ width: j===0?200 : j===1?60 : j===2?90 : j===3?80 : 40 }}>{col}</span>
        ))}
      </div>
    );
    if (h.kind === 'trow') return (
      <div key={i} style={{ display:'flex', color: h.mine ? c.body : c.muted, background: h.mine ? '#0a1a0f' : 'transparent' }}>
        {h.cols.map((col, j) => (
          <span key={j} style={{
            width: j===0?200 : j===1?60 : j===2?90 : j===3?80 : 40,
            fontWeight: h.mine && j===0 ? 700 : 400,
            color: j===4 ? c.done : (j===2 && col==='settled') ? c.done : (j===2 && col==='vending') ? c.live : (j===2 && col==='probing') ? c.label : undefined,
          }}>{j===0 && h.mine ? '▸ ' : j===0 ? '  ' : ''}{col}</span>
        ))}
      </div>
    );
    if (h.kind === 'kv') return (
      <div key={i} style={{ display:'flex', gap:8, paddingLeft:8 }}>
        <span style={{ color:c.dim, width:80, textTransform:'uppercase', fontSize:10, letterSpacing:1 }}>{h.k}</span>
        <span style={{ color: h.tag==='ok' ? c.done : c.body }}>{h.v}</span>
      </div>
    );
    if (h.kind === 'logline') return (
      <div key={i} style={{ display:'flex', gap:8, fontSize:11 }}>
        <span style={{ color:c.dim }}>{h.ts}</span>
        <span style={{ color:c.label, width:90 }}>{h.src}</span>
        <span style={{ color:c.muted }}>{h.text}</span>
      </div>
    );
    if (h.kind === 'star') return (
      <div key={i} style={{ display:'flex', gap:10, paddingLeft:8 }}>
        <span style={{ color:c.done, width:60 }}>{'★'.repeat(h.stars)}<span style={{color:c.dim}}>{'☆'.repeat(5-h.stars)}</span></span>
        <span style={{ color:c.body, width:140 }}>{h.who}</span>
        <span style={{ color:c.muted }}>{h.what}</span>
      </div>
    );
    if (h.kind === 'err')  return <div key={i} style={{color:c.rare, paddingLeft:8}}>✗ {h.text}</div>;
    if (h.kind === 'warn') return <div key={i} style={{color:c.label, paddingLeft:8}}>! {h.text}</div>;
    if (h.kind === 'info') return <div key={i} style={{color:c.muted, paddingLeft:8}}>{h.text}</div>;
    return <div key={i} style={{color: h.dim ? c.dim : c.body, paddingLeft:8}}>{h.text}</div>;
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100%', fontSize:12 }}>
      <div style={{ display:'flex', flex:1, gap:16, minHeight:0 }}>
        <div ref={scrollRef} style={{ flex:1, overflowY:'auto', paddingRight:6 }}>
          <pre style={{ lineHeight:1.45, margin:0, marginBottom:6 }}>
            {bannerLines.slice(0, banner).map((l, i) => (
              <div key={i} style={{ color:l.col }}>{l.text}</div>
            ))}
            {banner >= bannerLines.length && <span className="blink" style={{color:c.done}}>▂</span>}
          </pre>
          {history.map(renderRow)}
        </div>
        <div style={{ width:200, flexShrink:0, borderLeft:`1px solid ${c.dim}22`, paddingLeft:12 }}>
          <div style={{ color:c.dim, textTransform:'uppercase', letterSpacing:1, fontSize:10, marginBottom:6 }}>quick reference</div>
          {quickRefs.map(([cmd, d], i) => (
            <div key={i} style={{ marginBottom:6 }}>
              <div style={{ color:c.grad1, fontSize:11, fontWeight:600 }}>{cmd}</div>
              <div style={{ color:c.dim, fontSize:10 }}>{d}</div>
            </div>
          ))}
          <div style={{ marginTop:16, paddingTop:10, borderTop:`1px solid ${c.dim}22`, fontSize:10, color:c.dim, lineHeight:1.8 }}>
            <div><span style={{color:c.label}}>↑/↓</span> history</div>
            <div><span style={{color:c.label}}>enter</span> run</div>
            <div><span style={{color:c.label}}>clear</span> wipe</div>
          </div>
        </div>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:6, paddingTop:8, borderTop:`1px solid ${c.dim}33`, marginTop:8 }}>
        <span style={{color:c.done, fontWeight:700}}>jungl3›</span>
        <input
          ref={inputRef}
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={handleKey}
          className="team-input"
          style={{ flex:1, borderBottom:'none', width:'auto' }}
          placeholder="type a command · 'help' for list · ↑/↓ history"
        />
        <span className="blink" style={{color:c.done}}>█</span>
      </div>
    </div>
  );
}

// ── Frame ─────────────────────────────────────────────────────────────────
const ACT_TITLES = {
  0:'Marketplace Install', 1:'Enter Jungle', 2:'Shape Understory',
  3:'Refine in DMZ', 4:'Reach Canopy', 5:'Maker-Checker',
};

function TopBar({ act, elapsed }) {
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
  const ss = String(elapsed%60).padStart(2,'0');
  const label = act === 'op' ? 'Operator Console' : act === 'multi' ? 'Control Plane' : (ACT_TITLES[act] || '');
  const tag   = act === 'op' ? 'shell' : act === 'multi' ? 'plane' : `act ${act}`;
  return (
    <div className="topbar">
      <span style={{color:c.label}}>jungl3</span>
      <span style={{color:c.dim}}>·</span>
      <span style={{color:c.done}}>{tag}</span>
      <span style={{color:c.dim}}>·</span>
      <span style={{color:c.body}}>{label}</span>
      <span style={{flex:1}} />
      <span style={{color:c.dim}}>{mm}:{ss}</span>
    </div>
  );
}

function LogPane({ logs }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) ref.current.scrollTop = ref.current.scrollHeight;
  }, [logs.length]);
  const visible = logs.slice(-7);
  return (
    <div className="log-pane" ref={ref}>
      {visible.map((entry, i) => {
        const col  = entry.tone==='highlight' ? c.done : entry.tone==='warn' ? c.rare : c.muted;
        const pre  = entry.tone==='highlight' ? '▶ '   : entry.tone==='warn' ? '! '   : '  ';
        const preCol = entry.tone==='highlight' ? c.done : entry.tone==='warn' ? c.rare : c.dim;
        return (
          <div key={i} className="log-line" style={{color:col}}>
            <span style={{color:preCol}}>{pre}</span>{entry.text}
          </div>
        );
      })}
    </div>
  );
}

function Footer({ console: isConsole }) {
  const keys = isConsole
    ? [['type','jungle list · help'],['enter','run'],['r','restart demo']]
    : [['space','advance'],['→','fast-forward'],['←','replay act'],['r','restart'],['q','quit']];
  return (
    <div className="footer">
      {keys.map(([k,l]) => (
        <span key={k}>
          <span style={{color:c.label,fontWeight:700}}>[{k}]</span>
          <span style={{color:c.dim}}> {l}</span>
        </span>
      ))}
    </div>
  );
}

// ── Team Name Prompt ──────────────────────────────────────────────────────
const DEFAULT_TEAM = 'aurora';
function sanitize(s) { return s.toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24); }

function TeamNamePrompt({ onSubmit }) {
  const [val, setVal] = useState('');
  const [done, setDone] = useState(false);
  const ref = useRef(null);
  useEffect(() => { ref.current?.focus(); }, []);

  const submit = (name) => {
    const clean = sanitize(name) || DEFAULT_TEAM;
    setDone(true);
    setTimeout(() => onSubmit(clean), 350);
  };

  return (
    <div className="prompt-screen">
      <pre style={{ display:'inline-block', textAlign:'left', lineHeight:1.55, marginBottom:20 }}>
        {LOGO.map((line, i) => <Grad key={i} bold>{line}{'\n'}</Grad>)}
      </pre>
      <div style={{ marginBottom:14 }}>
        <span style={{color:c.label}}>ENTER JUNGLE</span>
        <span style={{color:c.dim}}> · name your jungle</span>
      </div>
      <div style={{ display:'inline-flex', alignItems:'center', gap:8 }}>
        <span style={{color:c.dim}}>›</span>
        <input
          ref={ref}
          className="team-input"
          value={val}
          placeholder={DEFAULT_TEAM}
          onChange={e => setVal(e.target.value)}
          onKeyDown={e => {
            if (e.key === 'Enter')  submit(val);
            if (e.key === 'Escape') submit('');
          }}
        />
      </div>
      <div style={{ marginTop:14, color:c.dim, fontSize:'0.85em', lineHeight:2 }}>
        <span style={{color:c.label}}>[enter]</span> confirm&nbsp;&nbsp;
        <span style={{color:c.label}}>[esc]</span> use default ({DEFAULT_TEAM})
      </div>
      {done && <div style={{ marginTop:10, color:c.done }}>entering jungle…</div>}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────
function App() {
  const [phase, setPhase] = useState('prompt');
  const [teamName, setTeamName] = useState(DEFAULT_TEAM);
  const [act, setAct]  = useState(0);
  const [actKey, setActKey] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [logs, setLogs] = useState([]);
  const startRef = useRef(Date.now());

  useInterval(() => {
    if (phase === 'play') setElapsed(Math.floor((Date.now() - startRef.current) / 1000));
  }, 1000);

  const handleLog = useCallback((text, tone) => {
    setLogs(p => [...p, { text, tone }]);
  }, []);

  const handleActComplete = useCallback(() => {
    setAct(prev => {
      // 0 → multiJungle interstitial → 1 → 2 → 3 → 4 → 5 → console
      if (prev === 0) { setActKey(k => k+1); return 'multi'; }
      if (prev === 'multi') { setActKey(k => k+1); return 1; }
      if (prev >= 5) { setPhase('console'); return prev; }
      setActKey(k => k+1);
      return prev + 1;
    });
  }, []);

  const handleTeamSubmit = (name) => {
    setTeamName(name);
    startRef.current = Date.now();
    setElapsed(0);
    setPhase('play');
  };

  useEffect(() => {
    const down = (e) => {
      if (phase === 'prompt' || phase === 'console') return;
      if (e.key === ' ')          { e.preventDefault(); gRunner.step(); }
      if (e.key === 'ArrowRight') { e.preventDefault(); gRunner.ff(); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); setActKey(k => k+1); }
      if (e.key === 'r') { setLogs([]); startRef.current = Date.now(); setElapsed(0); setAct(0); setActKey(k => k+1); setPhase('play'); }
    };
    window.addEventListener('keydown', down);
    return () => window.removeEventListener('keydown', down);
  }, [phase]);

  if (phase === 'prompt') {
    return (
      <div className="terminal">
        <TeamNamePrompt onSubmit={handleTeamSubmit} />
      </div>
    );
  }

  if (phase === 'console') {
    return (
      <div className="terminal">
        <TopBar act={'op'} elapsed={elapsed} />
        <div className="act-area" style={{ display:'flex' }}>
          <OperatorConsole teamName={teamName} />
        </div>
        <Footer console />
      </div>
    );
  }

  const shared = { speedMul:1, onComplete:handleActComplete, teamName, onLog:handleLog };
  const k = `${act}-${actKey}`;
  const displayAct = typeof act === 'number' ? act : '·';

  return (
    <div className="terminal">
      <TopBar act={displayAct} elapsed={elapsed} />
      <div className="act-area">
        {act === 0 && <Act0 key={k} {...shared} />}
        {act === 'multi' && <MultiJungle key={k} teamName={teamName} onContinue={handleActComplete} />}
        {act === 1 && <Act1 key={k} {...shared} />}
        {act === 2 && <Act2 key={k} {...shared} />}
        {act === 3 && <Act3 key={k} {...shared} />}
        {act === 4 && <Act4 key={k} {...shared} />}
        {act === 5 && <Act5 key={k} {...shared} />}
      </div>
      <LogPane logs={logs} />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
